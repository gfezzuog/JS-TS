<div class="my-3">
  <label class="form-label" for="inputText">
    {{ inputDate?.label }}
    <span>
      {{
        form.get(inputDate?.controlName).value
          | errorLabel: form.get(inputDate?.controlName)
      }}
    </span>
  </label>
  <input
    type="date"
    id="inputText"
    class="form-control"
    placeholder=""
    [formControl]="form.get(inputDate?.controlName)"
    [step]="inputDate?.step"
    [min]="inputDate?.min"
    [max]="inputDate?.max"
  />
</div>
