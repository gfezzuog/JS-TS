<div class="my-3">
  <label class="form-label" for="inputText">
    {{ inputModel.label }}
    <span>
      {{
        form.get(inputModel.controlName).value
          | errorLabel: form.get(inputModel.controlName)
      }}
    </span>
  </label>
  <input
    [type]="inputModel.type"
    name="inputText"
    id="inputText"
    class="form-control"
    [formControl]="form.get(inputModel.controlName)"
  />
</div>
