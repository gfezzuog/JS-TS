<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Position Column -->
  <ng-container *ngFor="let column of displayedColumns">
    <ng-container [matColumnDef]="column.property">
      <!-- Table Header -->
      <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>

      <ng-container *ngIf="!column.isAction; else action">
        <!-- Table Cell for normal columns: usa column.content su qualsiasi tipo T -->
        <td mat-cell *matCellDef="let element">
          {{ column.content(element) }}
        </td>
      </ng-container>

      <!-- Table Cell for special action column -->
      <ng-template #action>
        <td mat-cell *matCellDef="let element">
          <button (click)="action.onClick(element)" *ngFor="let action of actions">
              <i [ngClass]="action.classes"></i>

          </button>
        </td>
      </ng-template>
    </ng-container>
  </ng-container>
 
  <tr mat-header-row *matHeaderRowDef="rowDef"></tr>
  <tr mat-row *matRowDef="let row; columns: rowDef"></tr>
</table>
